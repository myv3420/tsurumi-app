<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef3f7">

<title id="app-title">時刻表アプリ</title>
<style>
  :root {
    --bg: #eef3f7;
    --surface: #ffffff;
    --surface2: #f2f6fa;
    --line: #dde6ee;
    --text: #1f2b38;
    --text-dim: #6b7c8f;
    --accent: #0f6f8c;
    --accent-soft: rgba(15,111,140,0.09);
    --highlight: #ff7a45;
    --route-ougi: #d9573f;
    --route-hama: #d9573f;
    --route-tsurumi: #2f6fa8;
    --route-keihin: #00bfff;
    --now-circle: #ff7a45;
    --selected: #0f6f8c;
    --danger: #d9473f;
    --status-normal: #1f8a70;
    --status-warn: #d9573f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 10px;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    scroll-behavior: smooth;
  }

  /* --- カード全体 --- */
  .card {
    background: var(--surface);
    border-radius: 16px;
    padding: 10px 12px;
    text-align: center;
    position: sticky;
    top: 10px;
    z-index: 100;
    border: 1px solid var(--line);
    margin-bottom: 10px;
    box-shadow: 0 10px 28px rgba(31,43,56,0.08);
  }
  .status-banner {
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 0.72rem;
    font-weight: bold;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .status-banner.normal { color: var(--status-normal); border-color: rgba(31,138,112,0.3); background: rgba(31,138,112,0.06); }
  .status-banner.warn { color: var(--status-warn); border-color: rgba(217,87,63,0.4); background: rgba(217,87,63,0.08); font-weight: 800; }
  
  .dir-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .dir-name {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.01em;
  }
  .dir-arrow { color: var(--text-dim); font-weight: 400; margin: 0 2px; }
  .edit-gear {
    background: var(--surface2);
    border: 1px solid var(--line);
    color: var(--accent);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .edit-gear.active {
    background: rgba(217,71,63,0.12);
    border-color: var(--danger);
    color: var(--danger);
  }
  .day-badge {
    font-size: 0.7rem;
    font-weight: bold;
    color: var(--highlight);
    margin-bottom: 6px;
  }
  .day-toggle {
    display: flex;
    background: var(--surface2);
    border-radius: 9px;
    padding: 2px;
    margin-bottom: 8px;
    border: 1px solid var(--line);
  }
  .tgl-btn {
    flex: 1;
    border: none;
    background: none;
    color: var(--text-dim);
    padding: 5px 4px;
    border-radius: 7px;
    font-weight: bold;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .tgl-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 2px 6px rgba(31,43,56,0.10);
  }
  .next-area {
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    transition: border-color 0.3s, background 0.3s;
  }
  .next-area.is-selected {
    border-color: var(--selected);
    background: rgba(15,111,140,0.12);
  }
  .next-main {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .next-time {
    font-size: 2.3rem;
    font-weight: 800;
    color: var(--highlight);
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .next-routes {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: flex-start;
  }
  .route-badge {
    font-size: 0.65rem;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 5px;
    color: #fff;
    white-space: nowrap;
  }
  .start-badge {
    font-size: 0.6rem;
    font-weight: bold;
    padding: 2px 5px;
    border-radius: 4px;
    color: var(--accent);
    background: #fff;
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .countdown {
    font-size: 0.9rem;
    font-weight: bold;
    margin-top: 4px;
    color: var(--text);
  }
  .second-bus {
    font-size: 0.75rem;
    font-weight: bold;
    color: var(--text-dim);
    margin-top: 3px;
    margin-bottom: 0px;
    display: block;
  }

  .arrival-strip {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--line);
    display: none;
  }
  .arrival-strip-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-weight: bold;
    margin-bottom: 4px;
    text-align: center;
  }
  .arrival-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 0 auto;
    width: fit-content;
    max-width: 100%;
  }
  .ac-label { font-size: 0.75rem; color: var(--text-dim); font-weight: bold; }
  .ac-time { font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
  .ac-dur { font-size: 0.7rem; color: var(--text-dim); }

  /* --- 一覧リスト部分 --- */
  .hour-row {
    display: flex;
    align-items: flex-start;
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
    scroll-margin-top: 250px;
  }
  .hour-label {
    width: 36px;
    font-weight: 800;
    color: var(--accent);
    font-size: 1.1rem;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .mins-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }
  .min-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 36px;
    padding: 5px 4px;
    border-radius: 9px;
    border: 2px solid transparent;
    background: var(--surface2);
    opacity: 0.45;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    position: relative;
  }
  .min-box.active { opacity: 1; background: var(--surface); border-color: var(--line); }
  .min-box.next-hl { border-color: var(--now-circle); background: #fff3ec; }
  .min-box.sel {
    border-color: var(--selected) !important;
    background: rgba(15,111,140,0.14) !important;
    transform: scale(1.12);
    opacity: 1;
    z-index: 5;
  }
  .min-box.editable { position: relative; }
  .min-box.editable::after {
    content: '×';
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--danger);
    color: #fff;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .m-val { font-size: 1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .m-route { font-size: 0.5rem; font-weight: bold; margin-top: -1px; }

  .rt-ougi .m-val, .rt-ougi .m-route { color: var(--route-ougi); }
  .rt-hama .m-val, .rt-hama .m-route { color: var(--route-hama); }
  .rt-tsurumi .m-val, .rt-tsurumi .m-route { color: var(--route-tsurumi); }
  .rt-keihin .m-val, .rt-keihin .m-route { color: var(--route-keihin); }

  .add-btn {
    font-size: 0.72rem;
    color: var(--accent);
    padding: 4px 10px;
    border: 1px dashed var(--accent);
    border-radius: 7px;
    cursor: pointer;
    align-self: center;
    background: var(--surface);
  }

  /* --- ドロワー（設定UI） --- */
  .drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(31,43,56,0.35);
    z-index: 300;
  }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
    z-index: 400;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    border-top: 1px solid var(--line);
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 -12px 32px rgba(31,43,56,0.14);
  }
  .drawer.open { transform: translateY(0); }
  .drawer.dragging { transition: none; }
  .drawer-handle-area { padding: 4px 0 16px; margin: -4px 0 0; cursor: grab; touch-action: none; }
  .drawer-handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto; }
  .drawer-title { font-size: 0.85rem; font-weight: bold; color: var(--text-dim); letter-spacing: 0.05em; margin-bottom: 14px; }
  .drawer-section { background: var(--surface2); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px; padding: 12px; }
  
  .setting-group-title {
    font-size: 0.8rem;
    font-weight: bold;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 10px;
  }
  .setting-label {
    font-size: 0.8rem;
    font-weight: bold;
    color: var(--text-dim);
    white-space: nowrap;
    width: 70px;
  }
  .setting-select {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: bold;
    font-family: inherit;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%6b7c8f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
  }
  .apply-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #c2b5ff;
    color: #2b1f52;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    margin-top: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: opacity 0.2s;
  }
  .apply-btn:active { opacity: 0.8; }

  .drawer-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer; border-bottom: 1px solid var(--line); transition: background 0.15s; }
  .drawer-item:last-child { border-bottom: none; }
  .drawer-item:active { background: rgba(31,43,56,0.05); }
  .drawer-item.danger { color: var(--danger); }
  .drawer-icon { font-size: 1.1rem; width: 24px; text-align: center; flex-shrink: 0; }
  .drawer-label { font-size: 0.85rem; font-weight: bold; flex: 1; color: var(--text); }
  .drawer-item.danger .drawer-label { color: var(--danger); }
  .drawer-sub { font-size: 0.7rem; color: var(--text-dim); }

  .toast {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: bold;
    z-index: 999;
    transition: transform 0.3s ease;
    border: 1px solid var(--line);
    box-shadow: 0 8px 22px rgba(31,43,56,0.14);
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: rgba(31,138,112,0.4); color: #1f8a70; }
  .toast.ng { border-color: rgba(217,71,63,0.4); color: var(--danger); }

  .footer-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(238,243,247,0.97);
    backdrop-filter: blur(6px);
    padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    z-index: 200;
    border-top: 1px solid var(--line);
  }
  .btn {
    flex: 1;
    padding: 12px 6px;
    border-radius: 12px;
    border: 1px solid var(--line);
    font-weight: bold;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .qr-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(31,43,56,0.45);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .qr-overlay.open { display: flex; }
  .qr-box {
    background: var(--surface);
    border-radius: 20px;
    padding: 24px 20px;
    width: min(320px, 85vw);
    text-align: center;
    border: 1px solid var(--line);
  }
  .qr-box img {
    width: 220px; height: 220px;
    background: #fff;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
  }
  .qr-url { font-size: 0.72rem; color: var(--text-dim); word-break: break-all; margin-bottom: 16px; }
  .qr-actions { display: flex; gap: 8px; }
  .qr-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--text);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
  }
  .qr-close { margin-top: 12px; font-size: 0.75rem; color: var(--text-dim); cursor: pointer; }
</style>
</head>
<body>

<div class="card">
  <div class="status-banner normal" id="status-banner" onclick="openTrainInfo()">
    <span id="status-icon">🟢</span>
    <span id="status-text">運行情報を確認中...</span>
  </div>

  <div class="dir-row">
    <div class="dir-name" id="dir-display">鶴見<span class="dir-arrow">→</span>浜川崎方面</div>
    <div class="edit-gear" id="edit-gear" onclick="openDrawer()">⚙️</div>
  </div>
  <div class="day-badge" id="day-badge">判定中...</div>
  <div class="day-toggle">
    <button id="tgl-w" class="tgl-btn" onclick="setDayMode('w')">平日</button>
    <button id="tgl-hol" class="tgl-btn" onclick="setDayMode('hol')">休日</button>
  </div>
  <div class="next-area" id="next-area">
    <div class="next-main">
      <div class="next-time" id="next-t">--:--</div>
      <div class="next-routes" id="next-routes"></div>
    </div>
    <div class="countdown" id="count">お待ちください</div>
    <div class="second-bus" id="second-info"></div>
    <div class="arrival-strip" id="arrival-strip">
      <div class="arrival-strip-label">⏱️ 到着予定時刻・所要時間</div>
      <div id="arrival-card-wrap"></div>
    </div>
  </div>
</div>

<div id="list"></div>

<!-- 設定ドロワー -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle-area" id="drawer-handle-area">
    <div class="drawer-handle"></div>
  </div>
  <div class="drawer-title">⚙️ 設定・ダイヤ管理</div>

  <div class="drawer-section">
    <div class="setting-group-title">🚃 表示する路線設定</div>
    <div class="setting-row">
      <div class="setting-label">路線選択</div>
      <select id="select-line" class="setting-select">
        <option value="tsurumi">鶴見線</option>
        <option value="keihin">京浜東北線</option>
      </select>
    </div>
    <button class="apply-btn" onclick="applyLineSetting()">✅ 適用する</button>
  </div>

  <div class="drawer-section" style="padding: 4px 12px;">
    <div class="drawer-item" onclick="openQRModal()">
      <div class="drawer-icon">📱</div>
      <div>
        <div class="drawer-label">QRコードを表示して共有</div>
        <div class="drawer-sub">このアプリのURLをQRコードで共有</div>
      </div>
    </div>
    <div class="drawer-item" onclick="startEditMode()">
      <div class="drawer-icon">✏️</div>
      <div>
        <div class="drawer-label">時刻の編集モード</div>
        <div class="drawer-sub">時刻の追加・削除ができます</div>
      </div>
    </div>
  </div>

  <div class="drawer-section" style="padding: 4px 12px;">
    <div class="drawer-item danger" onclick="resetToDefault()">
      <div class="drawer-icon">🔄</div>
      <div>
        <div class="drawer-label">初期データに戻す</div>
        <div class="drawer-sub">編集内容をすべてリセット</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="qr-overlay" id="qr-overlay" onclick="if(event.target===this) closeQRModal()">
  <div class="qr-box">
    <img id="qr-img" src="" alt="QRコード">
    <div class="qr-url" id="qr-url"></div>
    <div class="qr-actions">
      <button class="qr-btn" onclick="shareURL()">📤 共有</button>
      <button class="qr-btn" onclick="copyURL()">📋 URLをコピー</button>
    </div>
    <div class="qr-close" onclick="closeQRModal()">閉じる</div>
  </div>
</div>

<div class="footer-nav">
  <button id="btn-dir0" class="btn active" onclick="setDirection('dir1')"></button>
  <button id="btn-dir1" class="btn" onclick="setDirection('dir2')"></button>
</div>

<script>
// --- 各路線の設定データ ---
const LINE_CONFIG = {
  tsurumi: {
    name: '鶴見線',
    delayUrl: 'https://transit.yahoo.co.jp/diainfo/29/0',
    duration: 13,
    dirs: {
      dir1: { label: '鶴見<span class="dir-arrow">→</span>浜川崎方面', btn: '鶴見→浜川崎', destName: '浜川崎 着' },
      dir2: { label: '浜川崎<span class="dir-arrow">→</span>鶴見', btn: '浜川崎→鶴見', destName: '鶴見 着' }
    }
  },
  keihin: {
    name: '京浜東北線',
    delayUrl: 'https://transit.yahoo.co.jp/diainfo/22/0',
    duration: 18,
    dirs: {
      dir1: { label: '横浜<span class="dir-arrow">→</span>蒲田方面', btn: '横浜→蒲田', destName: '蒲田 着' },
      dir2: { label: '蒲田<span class="dir-arrow">→</span>横浜方面', btn: '蒲田→横浜', destName: '横浜 着' }
    }
  }
};

const ROUTE_LABEL = { ougi: '扇町行', hama: '浜川崎行', tsurumi: '鶴見行', keihin: '各停' };
const ROUTE_COLOR = { ougi: 'var(--route-ougi)', hama: 'var(--route-hama)', tsurumi: 'var(--route-tsurumi)', keihin: 'var(--route-keihin)' };
const ROUTE_CLASS = { ougi: 'rt-ougi', hama: 'rt-hama', tsurumi: 'rt-tsurumi', keihin: 'rt-keihin' };

// --- 時刻表デフォルトデータ ---
const DEFAULT_DATA = {
  tsurumi: {
    dir1: {
      w: [

function parseMinList(obj) {
  const res = [];
  for (const h in obj) {
    obj[h].forEach(m => res.push({ h: parseInt(h), m, r: 'keihin' }));
  }
  return res;
}

async function checkHoliday() {
  const now = new Date();
  const y = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const todayStr = `${y}-${mm}-${dd}`;
  const dow = now.getDay();

  let holidayName = '';

  try {
    const res = await fetch(`https://holidays-jp.github.io/api/v1/${y}/date.json`);
    if (res.ok) {
      const data = await res.json();
      if (data[todayStr]) holidayName = data[todayStr];
    }
  } catch (e) {}

  if (holidayName || dow === 0 || dow === 6) {
    dayMode = 'hol';
  } else {
    dayMode = 'w';
  }

  const badge = document.getElementById('day-badge');
  if (holidayName) {
    badge.innerText = `【祝日: ${holidayName}】休日ダイヤ`;
    badge.style.color = 'var(--danger)';
  } else if (dayMode === 'hol') {
    badge.innerText = '今日は休日ダイヤです';
    badge.style.color = 'var(--highlight)';
  } else {
    badge.innerText = '今日は平日ダイヤです';
    badge.style.color = 'var(--accent)';
  }
  update();
}

async function fetchTrainStatus() {
  const lineAtStart = currentLine; // リクエスト開始時点の路線を記録
  const banner = document.getElementById('status-banner');
  const icon = document.getElementById('status-icon');
  const text = document.getElementById('status-text');
  const lineInfo = LINE_CONFIG[lineAtStart];

  try {
    // キャッシュ回避用にタイムスタンプを付与
    const cacheBusterUrl = `${lineInfo.delayUrl}?_=${Date.now()}`;
    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(cacheBusterUrl)}`);
    
    // 応答が返ってきた時点で路線が切り替わっていれば処理を破棄（古い情報で上書きしない）
    if (currentLine !== lineAtStart) return;

    if (res.ok) {
      const data = await res.json();
      const htmlText = data.contents;
      
      // 遅延・見合わせ・事故等の警告判定キーワード
      const isWarn = htmlText.includes('事故') || 
                     htmlText.includes('遅延') || 
                     htmlText.includes('運転見合わせ') || 
                     htmlText.includes('ダイヤ乱れ') || 
                     htmlText.includes('運転変更') ||
                     (htmlText.includes('trouble') && !htmlText.includes('平常運転'));

      if (!isWarn) {
        banner.className = 'status-banner normal';
        icon.innerText = '🟢';
        text.innerText = `${lineInfo.name}：平常運転`;
      } else {
        banner.className = 'status-banner warn';
        icon.innerText = '⚠️';
        text.innerText = `${lineInfo.name}：遅延・運行情報あり（タップで詳細）`;
      }
    } else {
      throw new Error('エラー');
    }
  } catch (e) {
    if (currentLine !== lineAtStart) return;
    banner.className = 'status-banner normal';
    icon.innerText = '🟢';
    text.innerText = `${lineInfo.name}：平常運転`;
  }
}

function openTrainInfo() {
  window.open(LINE_CONFIG[currentLine].delayUrl, '_blank');
}

function addMinutes(h, m, addM) {
  const total = h * 60 + m + addM;
  const nh = Math.floor(total / 60) % 24;
  const nm = total % 60;
  return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
}

function update() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const lineInfo = LINE_CONFIG[currentLine];

  document.getElementById('app-title').innerText = `${lineInfo.name} 時刻表`;
  document.getElementById('dir-display').innerHTML = lineInfo.dirs[currentDir].label;
  document.getElementById('tgl-w').classList.toggle('active', dayMode === 'w');
  document.getElementById('tgl-hol').classList.toggle('active', dayMode === 'hol');

  const gear = document.getElementById('edit-gear');
  gear.classList.toggle('active', isEditMode);
  gear.onclick = isEditMode ? toggleEditMode : openDrawer;
  gear.title = isEditMode ? '編集終了・保存' : '設定';
  gear.innerText = isEditMode ? '✅' : '⚙️';

  ['dir1', 'dir2'].forEach((dirId, idx) => {
    const btn = document.getElementById(`btn-dir${idx}`);
    if (btn) {
      btn.innerText = lineInfo.dirs[dirId].btn;
      btn.classList.toggle('active', dirId === currentDir);
      btn.onclick = () => setDirection(dirId);
    }
  });

  const rawData = db[currentLine]?.[currentDir]?.[dayMode] || [];
  const sorted = [...rawData].sort((a, b) => (a.h * 60 + a.m) - (b.h * 60 + b.m));
  const futures = sorted.filter(b => b.h * 60 + b.m > h * 60 + m);
  const next = futures[0] || null;
  const second = next ? futures.find(b => b.h * 60 + b.m > next.h * 60 + next.m) : null;

  const listDiv = document.getElementById('list');
  listDiv.innerHTML = '';
  let targetRow = null;

  for (let hour = 4; hour <= 23; hour++) {
    const mins = sorted.filter(b => b.h === hour);
    if (!mins.length && !isEditMode) continue;

    const row = document.createElement('div');
    row.className = 'hour-row';
    const wrap = document.createElement('div');
    wrap.className = 'mins-wrap';

    row.appendChild(Object.assign(document.createElement('div'), {
      className: 'hour-label',
      innerText: hour
    }));

    mins.forEach(item => {
      const isFuture = item.h * 60 + item.m > h * 60 + m;
      const isNext = next && item.h === next.h && item.m === next.m && item.r === next.r;
      const isSel = selectedBus && item.h === selectedBus.h && item.m === selectedBus.m && item.r === selectedBus.r;

      const box = document.createElement('div');
      box.className = [
        'min-box',
        ROUTE_CLASS[item.r] || '',
        isFuture ? 'active' : '',
        isNext ? 'next-hl' : '',
        isSel ? 'sel' : '',
        isEditMode ? 'editable' : ''
      ].filter(Boolean).join(' ');

      box.innerHTML = `<div class="m-val">${String(item.m).padStart(2,'0')}</div><div class="m-route">${ROUTE_LABEL[item.r] || ''}</div>`;
      box.onclick = () => isEditMode ? removeTime(item) : selectBus(item);

      wrap.appendChild(box);
      if (isNext) targetRow = row;
    });

    if (isEditMode) {
      const addBtn = document.createElement('div');
      addBtn.className = 'add-btn';
      addBtn.innerText = '＋ 追加';
      addBtn.onclick = () => addTime(hour);
      wrap.appendChild(addBtn);
    }

    row.appendChild(wrap);
    listDiv.appendChild(row);
  }

  const displayBus = selectedBus || next;
  const nextArea = document.getElementById('next-area');
  nextArea.classList.toggle('is-selected', !!selectedBus);

  if (displayBus) {
    document.getElementById('next-t').innerText = `${displayBus.h}:${String(displayBus.m).padStart(2,'0')}`;
    let routesHTML = '';
    const color = ROUTE_COLOR[displayBus.r] || 'var(--accent)';
    routesHTML += `<span class="route-badge" style="background:${color};">${ROUTE_LABEL[displayBus.r]}</span>`;
    
    if (selectedBus) {
      routesHTML += `<span class="start-badge" style="color:var(--selected);border-color:var(--selected);">選択中</span>`;
    }
    document.getElementById('next-routes').innerHTML = routesHTML;

    const busDate = new Date();
    busDate.setHours(displayBus.h, displayBus.m, 0, 0);
    const diffMin = Math.ceil((busDate - now) / 60000);

    const countEl = document.getElementById('count');
    if (diffMin >= 0) {
      countEl.innerText = `あと ${diffMin} 分`;
      countEl.style.display = 'block';
    } else {
      countEl.innerText = '';
      countEl.style.display = 'none';
    }

    const secEl = document.getElementById('second-info');
    if (second && !selectedBus) {
      secEl.innerText = `次は ${second.h}:${String(second.m).padStart(2,'0')}（${ROUTE_LABEL[second.r]}）`;
      secEl.style.display = 'block';
    } else {
      secEl.style.display = 'none';
    }

    const targetStationName = lineInfo.dirs[currentDir].destName;
    const durationMin = lineInfo.duration;
    const arrivalTime = addMinutes(displayBus.h, displayBus.m, durationMin);
    
    const stripEl = document.getElementById('arrival-strip');
    const wrapEl = document.getElementById('arrival-card-wrap');
    
    wrapEl.innerHTML = `
      <div class="arrival-card">
        <span class="ac-label">${targetStationName}</span>
        <span class="ac-time">${arrivalTime}</span>
        <span class="ac-dur">（所要時間 約${durationMin}分）</span>
      </div>
    `;
    stripEl.style.display = 'block';

    if (!initialScrollDone && targetRow) {
      setTimeout(() => {
        targetRow.scrollIntoView({ behavior: 'smooth', block: 'start' });
        initialScrollDone = true;
      }, 300);
    }
  } else {
    document.getElementById('next-t').innerText = '--:--';
    document.getElementById('next-routes').innerHTML = '';
    document.getElementById('count').innerText = '本日の運行は終了しました';
    document.getElementById('second-info').style.display = 'none';
    document.getElementById('arrival-strip').style.display = 'none';
  }
}

function setDirection(id) {
  currentDir = id;
  selectedBus = null;
  initialScrollDone = false;
  update();
}

function setDayMode(mode) {
  dayMode = mode;
  selectedBus = null;
  initialScrollDone = false;
  update();
}

function selectBus(bus) {
  selectedBus = (selectedBus && selectedBus.h === bus.h && selectedBus.m === bus.m && selectedBus.r === bus.r) ? null : bus;
  update();
}

function toggleEditMode() {
  isEditMode = !isEditMode;
  if (isEditMode) selectedBus = null;
  update();
  if (!isEditMode) {
    localStorage.setItem('train_db', JSON.stringify(db));
    showToast('💾 保存しました', 'ok');
  }
}

function addTime(hour) {
  const min = prompt(`${hour}時台の何分？（0〜59）`);
  if (min === null || min === '' || isNaN(min)) return;

  let route = 'keihin';
  if (currentLine === 'tsurumi') {
    if (currentDir === 'dir2') {
      route = 'tsurumi';
    } else {
      route = confirm('OK → 扇町行　 キャンセル → 浜川崎行') ? 'ougi' : 'hama';
    }
  }

  const entry = { h: hour, m: parseInt(min), r: route };
  db[currentLine][currentDir][dayMode].push(entry);
  update();
}

function removeTime(item) {
  if (!confirm(`${item.h}:${String(item.m).padStart(2,'0')} ${ROUTE_LABEL[item.r]} を削除しますか？`)) return;
  db[currentLine][currentDir][dayMode] = db[currentLine][currentDir][dayMode].filter(b => !(b.h === item.h && b.m === item.m && b.r === item.r));
  update();
}

function openDrawer() {
  document.getElementById('select-line').value = currentLine;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

function startEditMode() {
  closeDrawer();
  isEditMode = true;
  selectedBus = null;
  update();
}

(function setupDrawerDrag() {
  const drawer = document.getElementById('drawer');
  const handleArea = document.getElementById('drawer-handle-area');
  let startY = 0, currentY = 0, dragging = false;

  handleArea.addEventListener('click', () => closeDrawer());
  handleArea.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY;
    currentY = startY;
    dragging = true;
    drawer.classList.add('dragging');
  }, { passive: true });

  handleArea.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    currentY = e.touches[0].clientY;
    const delta = Math.max(0, currentY - startY);
    drawer.style.transform = `translateY(${delta}px)`;
  }, { passive: true });

  handleArea.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    drawer.classList.remove('dragging');
    const delta = currentY - startY;
    drawer.style.transform = '';
    if (delta > 60) closeDrawer();
  });
})();

function openQRModal() {
  closeDrawer();
  const url = location.href;
  document.getElementById('qr-img').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
  document.getElementById('qr-url').innerText = url;
  document.getElementById('qr-overlay').classList.add('open');
}

function closeQRModal() {
  document.getElementById('qr-overlay').classList.remove('open');
}

function shareURL() {
  const url = location.href;
  if (navigator.share) {
    navigator.share({ title: '時刻表アプリ', url }).catch(() => {});
  } else {
    copyURL();
  }
}

function copyURL() {
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(() => showToast('📋 URLをコピーしました', 'ok'))
      .catch(() => showToast('❌ コピーに失敗しました', 'ng'));
  } else {
    showToast('❌ コピーに対応していません', 'ng');
  }
}

function resetToDefault() {
  if (!confirm('初期データに戻しますか？\n編集した内容はすべて消えます。')) return;
  db = JSON.parse(JSON.stringify(DEFAULT_DATA));
  localStorage.setItem('train_db', JSON.stringify(db));
  closeDrawer();
  update();
  showToast('🔄 初期データに戻しました', 'ok');
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  requestAnimationFrame(() => {
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  });
}

checkHoliday();
fetchTrainStatus();
setInterval(update, 10000);
setInterval(fetchTrainStatus, 300000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW登録失敗:', err));
}
</script>
